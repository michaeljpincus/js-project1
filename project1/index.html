<!DOCTYPE html>
<html lang="en">
<head>
    <title>Project 1</title> 
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=News+Cycle:wght@400;700&display=swap" rel="stylesheet">

<body>
    <button id="reset-zoom">Reset Zoom</button>
    <div id="map">
    <div id="map-title">Atlas of the Newest New Yorkers</div>
    <div id="map-footer">Source: <em>The Newest New Yorkers: A Statistical Portrait of Foreign-born Residents and Their Role in Shaping the City's Population</em> (2026 edition), NYC Department of City Planning</div>
</div>
</div>

    <div id="info-panel" class="hidden">

            <h2 id="panel-title"></h2>
            <button id="close-panel">&times;</button>
        </div>
        <p id="panel-subtitle"></p>
        <p id="panel-label">Top foreign-born communities</p>
        <p id="label-subtitle">(% of foreign-born population)</p>
        <div id="panel-countries"></div>
    </div>

    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="js/config.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
